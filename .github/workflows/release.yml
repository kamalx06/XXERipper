name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install 'httpx[http2]' flask
      - name: Syntax check
        run: python -c "import ast; ast.parse(open('xxeripper.py').read()); print('ok')"
      - name: Help flag works
        run: python xxeripper.py --help > /dev/null
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PYVER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PYVER" ]; then
            echo "Tag $TAG does not match pyproject version $PYVER"
            exit 1
          fi
          echo "Version $TAG consistent"

  build-python:
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify artifacts
        run: |
          ls -la dist/
          test -f dist/*.whl && echo "wheel found"
          test -f dist/*.tar.gz && echo "sdist found"
      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*

  build-deb:
    needs: validate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper dh-python python3-all \
            pybuild-plugin-pyproject python3-hatchling \
            python3-httpx python3-h2 python3-anyio python3-httpcore \
            python3-certifi python3-idna python3-sniffio \
            python3-flask
      - run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v6
        with:
          name: deb-dist
          path: dist/*.deb

  build-rpm:
    needs: validate
    runs-on: ubuntu-26.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          dnf install -y \
            git rpm-build \
            python3-devel pyproject-rpm-macros \
            python3-pip python3-hatchling \
            python3-httpx python3-h2 python3-anyio python3-httpcore \
            python3-certifi python3-idna python3-sniffio \
            python3-flask
      - run: bash scripts/build-rpm.sh
      - uses: actions/upload-artifact@v6
        with:
          name: rpm-dist
          path: dist/*.rpm

  build-arch:
    needs: validate
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm base-devel git sudo \
            python python-httpx python-h2 python-anyio python-httpcore \
            python-certifi python-idna python-sniffio \
            python-flask \
            python-build python-installer python-wheel python-hatchling \
            python-pytest
      - name: Create build user (makepkg cannot run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
      - name: Build Arch package
        run: su builder -c "bash scripts/build-arch.sh"
      - uses: actions/upload-artifact@v6
        with:
          name: arch-dist
          path: dist/*.pkg.tar.*
          
  publish-pypi:
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/xxeripper
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build-python, build-deb, build-rpm, build-arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            python-dist/*
            deb-dist/*
            rpm-dist/*
            arch-dist/*